name: Setup odx
description: Install odx, the Odoo project CLI, cache its data, and run its nightly bot for upstream updates.
author: getfluvo
branding:
  icon: git-merge
  color: purple

inputs:
  version:
    description: The odx release to install (`latest`, or `0.0.8`); `none` uses the odx already on PATH.
    default: latest
  cache:
    description: Restore and save the odx cache, keyed on odx.lock.
    default: "true"
  working-directory:
    description: The project directory.
    default: "."
  bot:
    description: Run `odx bot run`, the nightly cycle (see "Running the bot nightly" in the odx documentation).
    default: "false"
  apply:
    description: "`true`, `false`, or `auto`: apply, except on pull_request events, where the run only plans."
    default: auto
  series:
    description: Only the dashboard of this series, with `bot`.
    default: ""
  max-prs:
    description: Pull requests a run opens at most, with `bot` (default `[tool.odx.bot] max_prs_per_run`, else 10).
    default: ""
  remote:
    description: The git remote of the project repository, with `bot`.
    default: origin

outputs:
  version:
    description: The installed odx version.
    value: ${{ steps.version.outputs.version }}
  plan-json:
    description: The path of the run's JSON (`odx --json bot run`), with `bot`.
    value: ${{ steps.bot.outputs.plan-json }}
  dashboard-issue:
    description: The number of the dashboard issue, with `bot`.
    value: ${{ steps.bot.outputs.dashboard-issue }}

runs:
  using: composite
  steps:
    - name: Install odx
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        WORKDIR: ${{ inputs.working-directory }}
      # uv, pipx or pip, whichever the runner has: GitHub's runners all have
      # pipx, Forgejo's often only Python. The PATH and environment entries
      # come from those tools and the runner, not from inputs.
      run: | # zizmor: ignore[github-env]
        if [ "$VERSION" != none ]; then
          spec=odx-cli
          if [ "$VERSION" != latest ]; then spec="odx-cli==${VERSION#v}"; fi
          if command -v uv >/dev/null; then
            uv tool install --force "$spec"
            bin=$(uv tool dir --bin)
          elif command -v pipx >/dev/null; then
            pipx install --force "$spec"
            # `environment --value` needs pipx 1.5; distributions ship older.
            bin=$(pipx environment --value PIPX_BIN_DIR 2>/dev/null || echo "${PIPX_BIN_DIR:-$HOME/.local/bin}")
          else
            python=$(command -v python3 || command -v python)
            PIP_BREAK_SYSTEM_PACKAGES=1 "$python" -m pip install --user --upgrade "$spec"
            base=$("$python" -m site --user-base)
            bin="$base/bin"
            if [ "$RUNNER_OS" = Windows ]; then
              bin="$(dirname "$("$python" -m site --user-site)")/Scripts"
            fi
          fi
          echo "$bin" >> "$GITHUB_PATH"
        fi
        # One cache directory on every OS, in a form odx and actions/cache
        # both read; a directory the workflow chose stays.
        cache="${ODX_CACHE_DIR:-$RUNNER_TEMP/odx-cache}"
        echo "ODX_CACHE_DIR=$cache" >> "$GITHUB_ENV"
        echo "cache-dir=$cache" >> "$GITHUB_OUTPUT"
        # hashFiles sees only the workspace; without an odx.lock the run
        # gets a key of its own, so the cache is not frozen at its first save.
        lock="$WORKDIR/odx.lock"
        if [ -f "$lock" ] && hash=$(git hash-object "$lock" 2>/dev/null); then
          echo "lock-hash=$hash" >> "$GITHUB_OUTPUT"
        else
          echo "lock-hash=run-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
        fi
    - name: The odx version
      id: version
      shell: bash
      run: |
        # `odx 0.0.8 (odoo-lint ...)`: the second word. A separate
        # assignment, so a missing odx fails the step.
        out=$(odx --version)
        read -r _ version _ <<< "$out"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Restore the odx cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.install.outputs.cache-dir }}
        key: odx-${{ runner.os }}-${{ steps.install.outputs.lock-hash }}
        restore-keys: odx-${{ runner.os }}-
    - name: odx bot run
      id: bot
      if: inputs.bot == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APPLY: ${{ inputs.apply }}
        SERIES: ${{ inputs.series }}
        MAX_PRS: ${{ inputs.max-prs }}
        REMOTE: ${{ inputs.remote }}
        EVENT: ${{ github.event_name }}
      run: |
        args=(--json bot run --remote "$REMOTE")
        if [ "$APPLY" = true ] || { [ "$APPLY" = auto ] && [ "$EVENT" != pull_request ]; }; then
          args+=(--apply)
        fi
        if [ -n "$SERIES" ]; then args+=(--series "$SERIES"); fi
        if [ -n "$MAX_PRS" ]; then args+=(--max-prs "$MAX_PRS"); fi
        plan="$RUNNER_TEMP/odx-plan.json"
        odx "${args[@]}" > "$plan"
        echo "plan-json=$plan" >> "$GITHUB_OUTPUT"
        python=$(command -v python3 || command -v python)
        issue=$("$python" "$GITHUB_ACTION_PATH/scripts/dashboard_issue.py" "$plan")
        echo "dashboard-issue=$issue" >> "$GITHUB_OUTPUT"
